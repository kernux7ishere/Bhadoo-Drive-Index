name = "bhadoo-drive-index"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>`, never put them in this file):
#   ACCOUNTS_JSON          JSON array of Google accounts (OAuth or Service Account)
#                          Overflow goes in ACCOUNTS_JSON_2 ... ACCOUNTS_JSON_9 (5 KB limit per secret)
#   CRYPTO_BASE_KEY        16/24/32 chars   (openssl rand -hex 16)
#   HMAC_BASE_KEY          >= 32 chars      (openssl rand -hex 32)
#   USERS_JSON             only if ENABLE_LOGIN = "true" and LOGIN_DATABASE = "Local"
#   LOGIN_GOOGLE_CLIENT_ID / LOGIN_GOOGLE_CLIENT_SECRET   only for social login
#
# NOTE: Workers Free allows at most 32 variables per Worker (vars + secrets).

[vars]
ENVIRONMENT = "production"
SCOPE = "[{\"id\":\"root\",\"type\":\"root\",\"name\":\"drive-brick\",\"account\":\"drive-brick\",\"protect_file_link\":false},{\"id\":\"root\",\"type\":\"root\",\"name\":\"drive-inv\",\"account\":\"drive-inv\",\"protect_file_link\":false},{\"id\":\"root\",\"type\":\"root\",\"name\":\"drive-linus\",\"account\":\"drive-linus\",\"protect_file_link\":false}]"
SITE_NAME = "Cloud Index"
